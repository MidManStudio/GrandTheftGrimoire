# .github/workflows/npc-rust-ci.yml
# Correctness gate for the NPC system. Job `test`: enum sync across MDIX/C#/Rust, formatting, tests, Clippy.
# Job `csharp-abi`: the Unity-side native layer (C# structs, P/Invoke, managed fallback) run against the real
# Rust library with plain .NET, no Unity. Runs on every push/PR touching the NPC paths.
# Benchmarks live in npc-rust-ffi-bench.yml (dispatch-only).

name: NPC Rust CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'rust/**'
      - 'Assets/NPC/**'
      - 'Assets/MidManStudio/Gtg/ECS/NPC/**'
      - 'Assets/MidManStudio/Gtg/Managed/NPC/**'
      - 'Assets/MidManStudio/Gtg/Managed/Health/**'
      - 'scripts/check_npc_enum_sync.py'
      - '.github/workflows/npc-rust-ci.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'Assets/NPC/**'
      - 'Assets/MidManStudio/Gtg/ECS/NPC/**'
      - 'Assets/MidManStudio/Gtg/Managed/NPC/**'
      - 'Assets/MidManStudio/Gtg/Managed/Health/**'
      - 'scripts/check_npc_enum_sync.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # implies -eo pipefail
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Enum sync (MDIX, C#, Rust)
        working-directory: .
        run: python3 scripts/check_npc_enum_sync.py .

      - name: Formatting
        run: cargo fmt --all --check

      - name: Tests
        run: |
          set -o pipefail
          mkdir -p ci-out
          cargo test --workspace 2>&1 | tee ci-out/test.txt

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Publish run summary
        if: always()
        run: |
          {
            echo '## GTG NPC Rust CI'
            echo
            echo "**Rust:** \`$(rustc --version)\`"
            echo
            echo '### Test results'
            echo '```text'
            grep -E '^(test result:|test .* FAILED|failures:|error)' ci-out/test.txt 2>/dev/null | head -c 20000 || echo '(no test output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  csharp-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build native library
        working-directory: rust
        run: cargo build -p gtg-npc-ffi

      - name: C# native layer against the real library
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/rust/target/debug
        run: |
          set -o pipefail
          mkdir -p ci-out
          dotnet run --project rust/npc/csharp-abi-test -c Release 2>&1 | tee ci-out/csharp-abi.txt

      - name: Publish run summary
        if: always()
        run: |
          {
            echo '## GTG NPC C# ABI test'
            echo
            echo 'Unity-side native layer compiled with plain .NET and run against the real `gtg_npc_ffi` library. No Unity is involved.'
            echo '```text'
            head -c 20000 ci-out/csharp-abi.txt 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  managed-npc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build native library
        working-directory: rust
        run: cargo build -p gtg-npc-ffi

      - name: Managed NPC checks on the managed fallback
        run: |
          set -o pipefail
          mkdir -p ci-out
          dotnet run --project rust/npc/managed-npc-test -c Release -- fallback 2>&1 | tee ci-out/managed-npc-fallback.txt

      - name: Managed NPC checks on the real native library
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/rust/target/debug
        run: |
          set -o pipefail
          dotnet run --project rust/npc/managed-npc-test -c Release -- native 2>&1 | tee ci-out/managed-npc-native.txt

      - name: Publish run summary
        if: always()
        run: |
          {
            echo '## GTG Managed NPC checks'
            echo
            echo 'Managed NPC code compiled with plain .NET (C# 9) against hand written Unity stubs. The stub raycast is a callback, so real colliders and layers are not covered. No Unity is involved.'
            for f in managed-npc-fallback managed-npc-native; do
              echo "### $f"
              echo '```text'
              head -c 20000 "ci-out/$f.txt" 2>/dev/null || echo '(no output captured)'
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
