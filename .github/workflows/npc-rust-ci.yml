# .github/workflows/npc-rust-ci.yml
# Correctness gate for the NPC system: enum sync across MDIX/C#/Rust, formatting, tests, Clippy. Runs on every push/PR
# touching rust/**. Benchmarks live in npc-rust-ffi-bench.yml (dispatch-only).

name: NPC Rust CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'rust/**'
      - 'Assets/NPC/**'
      - 'Assets/MidManStudio/Gtg/NPC/**'
      - 'scripts/check_npc_enum_sync.py'
      - '.github/workflows/npc-rust-ci.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'Assets/NPC/**'
      - 'Assets/MidManStudio/Gtg/NPC/**'
      - 'scripts/check_npc_enum_sync.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # implies -eo pipefail
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Enum sync (MDIX, C#, Rust)
        working-directory: .
        run: python3 scripts/check_npc_enum_sync.py .

      - name: Formatting
        run: cargo fmt --all --check

      - name: Tests
        run: |
          set -o pipefail
          mkdir -p ci-out
          cargo test --workspace 2>&1 | tee ci-out/test.txt

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Publish run summary
        if: always()
        run: |
          {
            echo '## GTG NPC Rust CI'
            echo
            echo "**Rust:** \`$(rustc --version)\`"
            echo
            echo '### Test results'
            echo '```text'
            grep -E '^(test result:|test .* FAILED|failures:|error)' ci-out/test.txt 2>/dev/null | head -c 20000 || echo '(no test output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
