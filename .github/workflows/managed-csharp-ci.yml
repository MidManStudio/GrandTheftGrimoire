# .github/workflows/managed-csharp-ci.yml
# Compile gate for the Managed C# stack. The project has no assembly definitions, so one compile error in any
# Managed file stops every system in Unity. This job compiles Managed/ (all folders except NPC, Crown, Chemistry,
# Quests and Inventory) at C# 9, the language level of Unity 2022.3, with plain .NET against hand written stand-ins for
# UnityEngine, uGUI, TextMeshPro and the Input System, and then runs the checks in building-test/.
# NPC, Crown and Health are compiled by the second job, with the NPC harness on its managed fallback, because the
# path filter of npc-rust-ci.yml does not list Managed/Crown/ or Managed/Hud/ and the Crown heat component
# implements an interface of Hud. That workflow still runs the real native library. Quests needs the Questly
# package and Inventory needs the Inventorizz package, and managed-packages-ci.yml compiles both. Chemistry needs
# the Alembic package and is compiled by no job. Documentation: docs/GrandTheftGrimoire/managed.md, section "CI and Workflows".

name: Managed C# CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'Assets/MidManStudio/Gtg/Managed/**'
      - 'Assets/MidManStudio/Gtg/Data/**'
      - 'building-test/**'
      - 'rust/npc/managed-npc-test/**'
      - '.github/workflows/managed-csharp-ci.yml'
  pull_request:
    paths:
      - 'Assets/MidManStudio/Gtg/Managed/**'
      - 'Assets/MidManStudio/Gtg/Data/**'
      - 'building-test/**'
      - 'rust/npc/managed-npc-test/**'
      - '.github/workflows/managed-csharp-ci.yml'

permissions:
  contents: read

jobs:
  managed-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # building-test/nuget.config clears every package source, and the project has no package references,
      # so the restore needs no network.
      - name: Compile Managed C# at C# 9
        run: |
          set -o pipefail
          mkdir -p ci-out
          dotnet build building-test/BuildingTest.csproj -c Release --nologo 2>&1 | tee ci-out/build.txt

      - name: Run the checks
        run: |
          set -o pipefail
          dotnet run --project building-test/BuildingTest.csproj -c Release --no-build 2>&1 | tee ci-out/checks.txt

      - name: Publish run summary
        if: always()
        run: |
          {
            echo '## GTG Managed C# CI'
            echo
            echo 'Managed sources compiled at C# 9 with plain .NET against hand written Unity, uGUI, TextMeshPro and Input System stand-ins, then run through the checks in `building-test/`. This is not Unity. A red compile step means a Managed file would break the Unity compile, or a file uses a Unity member the stand-ins do not have yet.'
            echo
            echo '### Compile'
            echo '```text'
            grep -E 'error|Warn|Build succeeded|Elapsed' ci-out/build.txt 2>/dev/null | head -c 20000 || echo '(no build output captured)'
            echo '```'
            echo
            echo '### Checks'
            echo '```text'
            tail -n 60 ci-out/checks.txt 2>/dev/null | head -c 20000 || echo '(no check output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  managed-npc-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # The managed fallback of the NPC decision needs no native library. The run against the real library
      # stays in npc-rust-ci.yml.
      - name: Compile Crown, NPC and Health and run their checks on the managed fallback
        run: |
          set -o pipefail
          mkdir -p ci-out
          dotnet run --project rust/npc/managed-npc-test -c Release -- fallback 2>&1 | tee ci-out/managed-npc-fallback.txt

      - name: Publish run summary
        if: always()
        run: |
          {
            echo '## GTG Managed NPC compile and checks (managed fallback)'
            echo
            echo 'Crown, NPC and Health compiled at C# 9 with plain .NET against the NPC harness stand-ins, which includes the Crown heat component of the HUD. Checks run on the managed fallback only.'
            echo '```text'
            tail -n 40 ci-out/managed-npc-fallback.txt 2>/dev/null | head -c 20000 || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
